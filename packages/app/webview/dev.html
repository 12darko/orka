<!DOCTYPE html>
<!--
  Standalone preview of the chat webview for UI work: stubs the VS Code API, applies VS Code-like
  theme variables and replays a scripted agent session. Build first (npm run build), then open
  this file in a browser. Append ?light for the light theme, ?empty for the empty state, ?tr for Turkish,
  ?settings=skills (or agents/providers/control) to open a settings tab, ?ide for the desktop app's
  window (its IDE layout and its own theme), with ?collapsed for its sidebar closed.
-->

      document.documentElement.dataset.layout = 'ide';

      document.write('<link rel="stylesheet" href="../dist/ide.css"><link rel="stylesheet" href="desktop-theme.css">');
    }
  </script>

  <script>
    const params = new URLSearchParams(location.search);
    const ide = params.has('ide');

    let theme = params.has('light') ? 'light' : 'dark';
    const sent = [];
    const ago = (s) => new Date(Date.now() - s * 1000).toISOString();
    const task = (id, title, updated, requests = 1) => ({ id, title, createdAt: ago(updated + 600), updatedAt: ago(updated), requests });
    window.acquireVsCodeApi = () => ({
      postMessage(message) {
        sent.push(message);
        console.log('[webview -> extension]', message);
        if (message.type === 'ready') setTimeout(replay, 0);
        if (message.type === 'listTasks') setTimeout(() => deliver({ type: 'history', currentId: 't-now', tasks: [
          { id: 't-now', title: L('Rework the lobby in my Unity project: add a ready state and a 4-player limit.', 'Unity projemde lobby sistemini yeniden düzenle: hazır (ready) durumu ekle ve 4 oyuncu sınırı koy.'), createdAt: new Date(Date.now() - 3600e3).toISOString(), updatedAt: new Date(Date.now() - 120e3).toISOString(), requests: 3, model: 'claude-opus-5-5', usage: { inputTokens: 5900, outputTokens: 2410, cacheReadTokens: 51200, cacheWriteTokens: 6100 } },
          { id: 't-old', title: 'Explain the networking architecture', createdAt: new Date(Date.now() - 2 * 86400e3).toISOString(), updatedAt: new Date(Date.now() - 2 * 86400e3).toISOString(), requests: 1, model: 'gemini-3.8-flash', usage: { inputTokens: 900, outputTokens: 400, cacheReadTokens: 0, cacheWriteTokens: 0 } },
        ] }), 0);
        if (message.type === 'getHunks') setTimeout(() => deliver({ type: 'hunks', path: message.path, hunks: [
          { header: '@@ -10,6 +10,9 @@', hidden: 0, lines: [
            { type: ' ', text: 'public class LobbyManager : NetworkBehaviour' }, { type: ' ', text: '{' },
            { type: '-', text: '    private readonly Dictionary<PlayerRef, bool> ready = new();' },
            { type: '+', text: '    public const int MaxPlayers = 4;' },
            { type: '+', text: '    [Networked, Capacity(MaxPlayers)]' },
            { type: '+', text: '    public NetworkDictionary<PlayerRef, NetworkBool> Ready => default;' },
            { type: ' ', text: '' }, { type: ' ', text: '    public override void Spawned()' } ] },
          { header: '@@ -48,4 +51,8 @@', hidden: 0, lines: [
            { type: ' ', text: '    public void OnPlayerJoined(NetworkRunner runner, PlayerRef player)' }, { type: ' ', text: '    {' },
            { type: '+', text: '        if (Ready.Count >= MaxPlayers) { runner.Disconnect(player); return; }' },
            { type: '+', text: '        Ready.Set(player, false);' }, { type: ' ', text: '    }' } ] },

        if (message.type === 'setSetting' && message.key === 'language') setTimeout(() => { lang = message.value === 'tr' ? 'tr' : 'en'; deliver({ type: 'config', config: makeConfig(false) }); }, 0);

        if (message.type === 'listSessions') setTimeout(() => deliver({ type: 'sessions', taskId: 't-now', groups: [
          { folder: root, name: 'LobbyDemo', tasks: [
            task('t-now', L('Rework the lobby in my Unity project: add a ready state and a 4-player limit.', 'Unity projemde lobby sistemini yeniden düzenle: hazır (ready) durumu ekle ve 4 oyuncu sınırı koy.'), 120, 3),
            task('t-2', L('Fix the jitter when the camera follows the player', 'Kamera oyuncuyu takip ederken oluşan titremeyi düzelt'), 5400),
            task('t-3', L('Explain the networking architecture', 'Networking mimarisini açıkla'), 2 * 86400),
            task('t-4', L('Add a settings menu with volume sliders', 'Ses kaydırıcılarıyla bir ayarlar menüsü ekle'), 4 * 86400, 2),
          ] },
          { folder: 'D:/game/SharedLib', name: 'SharedLib', tasks: [
            task('s-1', L('Write unit tests for the inventory system', 'Envanter sistemi için unit testler yaz'), 3 * 3600, 2),
            task('s-2', L('Upgrade the package to .NET 9', 'Paketi .NET 9\'a yükselt'), 6 * 86400),
          ] },
        ] }), 0);
        if (message.type === 'searchFiles') setTimeout(() => deliver({ type: 'fileMatches', query: message.query, files: ['Assets/Scripts/Net/LobbyManager.cs', 'Assets/Scripts/UI/LobbyView.cs'].filter((f) => f.toLowerCase().includes(message.query.toLowerCase())) }), 0);
      },

      setState: () => {},
    });

    const deliver = (message) => window.dispatchEvent(new MessageEvent('message', { data: message }));
    const ev = (event) => deliver({ type: 'event', event });
    const root = 'D:/game/LobbyDemo';

    let lang = params.has('tr') ? 'tr' : 'en';
    const L = (en, tr) => (params.has('tr') ? tr : en);
    const m = (id, label, family, note) => ({ id, label, family, note });
    const CLAUDE = [
      m('claude-fable-5-1', 'Fable 5.1', 'Claude Fable', 'most capable'), m('claude-fable-5', 'Fable 5', 'Claude Fable'),
      m('claude-opus-5-5', 'Opus 5.5', 'Claude Opus', 'recommended'), m('claude-opus-5', 'Opus 5', 'Claude Opus'), m('claude-opus-4-8', 'Opus 4.8', 'Claude Opus'), m('claude-opus-4-7', 'Opus 4.7', 'Claude Opus'), m('claude-opus-4-6', 'Opus 4.6', 'Claude Opus'),

      m('claude-haiku-4-5', 'Haiku 4.5', 'Claude Haiku', 'fastest'),
    ];
    function makeConfig(empty) {
      const providers = [
        { kind: 'claude', label: 'Claude API', local: false, ready: !empty, models: CLAUDE, model: 'claude-opus-5-5', key: empty ? undefined : { source: 'stored', hint: 'sk-ant••••4f2a' } },
        { kind: 'openai', label: 'OpenAI API', local: false, ready: false, models: [m('gpt-6-astra', 'GPT-6 Astra', 'GPT-6', 'most capable'), m('gpt-6-sol', 'GPT-6 Sol', 'GPT-6', 'faster'), m('gpt-6-luna', 'GPT-6 Luna', 'GPT-6', 'cheapest'), m('gpt-5.6-sol', 'GPT-5.6 Sol', 'GPT-5.6'), m('gpt-5.6-terra', 'GPT-5.6 Terra', 'GPT-5.6'), m('gpt-5.6-luna', 'GPT-5.6 Luna', 'GPT-5.6')], model: 'gpt-6-astra' },
        { kind: 'gemini', label: 'Gemini API', local: false, ready: true, models: [m('gemini-3.1-pro-preview', 'Gemini 3.1 Pro (preview)', 'Gemini Pro'), m('gemini-3.8-flash', 'Gemini 3.8 Flash', 'Gemini Flash', 'recommended for agents'), m('gemini-3.7-flash', 'Gemini 3.7 Flash', 'Gemini Flash'), m('gemini-3.5-flash', 'Gemini 3.5 Flash', 'Gemini Flash'), m('gemini-3.5-flash-lite', 'Gemini 3.5 Flash-Lite', 'Gemini Flash-Lite')], model: 'gemini-3.8-flash', key: { source: 'env', hint: 'GEMINI_API_KEY' } },
        { kind: 'claude-code', label: 'Claude Code (local)', local: true, ready: true, models: [m('default', 'CLI default', 'Latest (aliases)', 'whatever Claude Code uses'), m('opus', 'Opus (latest)', 'Latest (aliases)'), m('sonnet', 'Sonnet (latest)', 'Latest (aliases)'), m('haiku', 'Haiku (latest)', 'Latest (aliases)'), m('fable', 'Fable (latest)', 'Latest (aliases)'), ...CLAUDE], model: 'claude-opus-5-5' },
        { kind: 'custom:openrouter', label: 'OpenRouter', local: false, ready: true, models: [m('deepseek/deepseek-coder', 'deepseek-coder', 'deepseek'), m('meta-llama/llama-5-70b', 'llama-5-70b', 'meta-llama'), m('qwen/qwen-4-coder', 'qwen-4-coder', 'qwen')], model: 'qwen/qwen-4-coder', key: { source: 'stored', hint: 'sk-or-••••91ab' }, custom: { id: 'openrouter', baseUrl: 'https://openrouter.ai/api/v1', requiresKey: true } },
        { kind: 'custom:ollama', label: 'Ollama (local)', local: true, ready: true, models: [], model: '', custom: { id: 'ollama', baseUrl: 'http://localhost:11434/v1', requiresKey: false } },
      ].filter((p) => p.kind !== 'claude-code' || !params.has('nocc'));
      const main = empty
        ? { name: 'main', provider: 'claude', model: 'claude-opus-5-5', effective: { provider: 'claude', model: 'claude-opus-5-5' } }
        : { name: 'main', provider: 'claude', model: 'claude-opus-5-5', effective: { provider: 'claude', model: 'claude-opus-5-5' } };
      const skill = (name, description, source, enabled = true, overridesBuiltin = false) => ({ name, description, source, enabled, overridesBuiltin });
      return {
        locale: lang,
        mode: 'balanced',
        workspaceOpen: true,
        folders: [{ name: 'LobbyDemo', path: root }, { name: 'SharedLib', path: 'D:/game/SharedLib' }],
        folder: root,
        canOpenFolder: ide,
        app: { version: '0.2.0', checkUpdates: true, checkedAt: Date.now() - 3600e3 },
        ui: ide ? { layout: 'ide', theme } : undefined,
        skillsEnabled: true,
        skills: [
          skill('code-review', 'Reviewing code or a diff for bugs, risks and quality.', 'builtin'),
          skill('debugging', 'My own debugging rules: always add a log first.', 'user', true, true),
          skill('deploy', 'Deploying the game server to our Hetzner machines.', 'user'),
          skill('documentation', 'Writing or updating READMEs, API docs, code comments and changelogs.', 'builtin', false),
          skill('security', 'Security-sensitive work: auth, input handling, secrets, dependencies.', 'builtin'),
          skill('testing', 'Writing, fixing or extending automated tests.', 'builtin'),
          skill('unity', 'Unity projects (C# scripts, scenes, prefabs, ScriptableObjects, packages).', 'builtin'),
        ],
        skillErrors: [],
        skillsFolder: 'C:/Users/you/.orka/skills',
        externalAgents: [{ id: 'freebuff', label: 'Freebuff', description: 'Free, ad-supported terminal coding agent (open models, daily allowance).', installed: true, active: false }],
        mcp: { enabled: true, servers: [
          { name: 'unity-editor-mcp', source: 'settings', transport: 'stdio', target: 'unity mcp', enabled: true, state: 'ready', tools: 24 },
          { name: 'blender', source: 'settings', transport: 'stdio', target: 'uvx blender-mcp', enabled: true, state: 'error', tools: 0, error: 'the server exited (code 1): Blender is not running' },
          { name: 'UnityMCP', source: 'workspace', transport: 'http', target: 'http://localhost:8080/mcp', enabled: false, state: 'idle', tools: 0 },

        pricing: { 'gemini/gemini-3.8-*': { input: 0.3, output: 2.5 } },

          presets: [['openrouter','OpenRouter'],['deepseek','DeepSeek'],['xai','xAI (Grok)'],['mistral','Mistral'],['groq','Groq'],['together','Together AI'],['ollama','Ollama (local)'],['lmstudio','LM Studio (local)']].map(([id, label]) => ({ id, label, baseUrl: '', requiresKey: !/local/.test(label) })),

    function replay() {
      const empty = params.has('empty');
      deliver({
        type: 'init',
        session: { items: [], running: false, phase: 'idle', changes: [] },
        config: makeConfig(empty),

      if (params.get('settings')) deliver({ type: 'showSettings', tab: params.get('settings') });
      if (empty) return;

      ev({ type: 'run_started' });
      ev({ type: 'user_message', id: 'u1', text: L('Rework the lobby in my Unity project: add a ready state and a 4-player limit.', 'Unity projemde lobby sistemini yeniden düzenle: hazır (ready) durumu ekle ve 4 oyuncu sınırı koy.'), skills: ['unity'], attachments: ['Assets/Scripts/Net/LobbyManager.cs'] });

      ev({ type: 'assistant_start', id: 'a1' });

      ev({ type: 'assistant_end', id: 'a1', text: L('I will look at the current lobby and networking code first.', 'Önce mevcut lobby ve networking kodunu inceleyeceğim.'), model: 'claude-opus-5-5' });
      ev({ type: 'phase', phase: 'analyzing' });
      ev({ type: 'tool_call', call: { id: 't0', name: 'load_skill', title: 'Skill: unity', category: 'read', risk: 'safe', status: 'done', output: '<skill name="unity">…</skill>' } });

      sub({ type: 'assistant_start', id: 'sa_a1' });
      sub({ type: 'assistant_end', id: 'sa_a1', text: 'Players join through `OnPlayerJoined` in LobbyManager.cs:48.', model: 'gemini-3.8-flash' });
      sub({ type: 'usage', total: { inputTokens: 900, outputTokens: 120, cacheReadTokens: 0, cacheWriteTokens: 0 }, model: 'gemini-3.8-flash', byAgent: [{ agent: 'explore', provider: 'gemini', model: 'gemini-3.8-flash', calls: 3, usage: { inputTokens: 900, outputTokens: 120, cacheReadTokens: 0, cacheWriteTokens: 0 } }] });
      sub({ type: 'run_finished', reason: 'completed' });
      ev({ type: 'tool_call', call: { id: 'sa1', name: 'run_subagent', title: 'explore: Find how players join the lobby and where ready state could live', category: 'read', risk: 'safe', status: 'done', detail: 'Find how players join the lobby (Photon Fusion callbacks) and where a per-player ready state could live. Report file paths and line numbers.', output: '[explore sub-agent report - Gemini gemini-3.8-flash]\n- Join: `LobbyManager.OnPlayerJoined` (Assets/Scripts/Net/LobbyManager.cs:48)\n- No max-player check exists yet\n- Best place for ready state: a `[Networked] NetworkDictionary<PlayerRef, bool>` on LobbyManager' } });

      ev({ type: 'plan', plan: { explanation: L('Ready state lives in a networked dictionary per PlayerRef; the UI subscribes to it.', 'Ready durumu PlayerRef başına networked bir sözlükte tutulacak; UI bu duruma abone olacak.'), steps: [
        { title: L('Analyze the networking setup', 'Mevcut networking mimarisini analiz et'), status: 'completed' },
        { title: L('LobbyManager: player limit and ready state', 'LobbyManager: oyuncu sınırı ve ready durumu'), status: 'completed' },
