name: Release

# Push a tag like v0.2.0 (matching the version in packages/vscode-extension/package.json and a
# "## 0.2.0" section in CHANGELOG.md) to build, test and publish a GitHub release with the .vsix
# and the desktop app as one Windows executable. With an NPM_TOKEN secret, the CLI is published
# to npm too.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:exe
      - run: ./packages/desktop/dist/orka-desktop.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: orka-desktop-exe
          path: packages/desktop/dist/orka-desktop.exe
          if-no-files-found: error

  release:
    needs: desktop-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the extension version
        run: |
          version="v$(node -p "require('./packages/vscode-extension/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the extension version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No \"## ${GITHUB_REF_NAME#v}\" section in CHANGELOG.md." >&2; exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          name: orka-desktop-exe
          path: desktop-exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/vscode-extension/dist/*.vsix desktop-exe/orka-desktop.exe --title "Orka $GITHUB_REF_NAME" --notes-file notes.md
      - name: Check for an npm token
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "publish=true" >> "$GITHUB_OUTPUT"; else echo "No NPM_TOKEN secret: the CLI is not published to npm."; fi
      - name: Publish the CLI to npm
        if: steps.npm.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish -w orka-agent --access public --provenance
