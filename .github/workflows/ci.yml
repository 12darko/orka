name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # What the Release workflow ships, so a packaging problem shows up before a tag is pushed.
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - run: npm run desktop:exe
      # A windowed program (no console): PowerShell neither waits for it nor shows its output
      # unless both are asked for.
      - name: orka-desktop.exe --version
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP orka-desktop-version.txt
          $p = Start-Process (Resolve-Path packages/desktop/dist/orka-desktop.exe).Path -ArgumentList '--version' -RedirectStandardOutput $out -Wait -PassThru
          $version = Get-Content $out -Raw
          Write-Output $version
          if ($p.ExitCode -ne 0 -or -not $version) { throw "orka-desktop.exe --version printed nothing (exit code $($p.ExitCode))." }
      # The minified CLI the release attaches, through the CLI's end-to-end tests.
      - run: npm run prepublishOnly -w orka-agent
      - run: node --test "test/*.test.mjs"
        working-directory: packages/cli
      - run: npm pack -w orka-agent --dry-run
